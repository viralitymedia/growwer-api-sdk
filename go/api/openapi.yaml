              schema:
                $ref: "#/components/schemas/Error"
          description: "The `Idempotency-Key` was used for a different request (code\
            \ `idempotency_key_reused`), its first request is still running (code\
            \ `idempotency_request_in_progress`), or its first request failed and\
            \ may have taken effect (code `idempotency_outcome_unknown`)."
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "No file was sent as the `file` field, or it is too large,\
            \ not an odt, doc, docx or txt document, or its name is longer than 255\
            \ characters (code `validation_failed`)."
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Over the rate limit (code `rate_limit_exceeded`), or too many\
            \ failed authentications (code `too_many_failed_authentications`): with\
