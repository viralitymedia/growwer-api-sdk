  /api/v1/projects/{id}/saved-filters/{filterId}/media-count:
    get:
      description: "How many medias of the project's catalogue one of your saved filters\
        \ matches: the `total` of GET /projects/{id}/medias with its `savedFilterId`.\
        \ The number is cached for up to 24 hours, and it can differ from the count\
        \ the web shows, which is not limited to the project's catalogue. A filter\
        \ saved on the web that uses a filter the API does not support is refused\
        \ with 422 `saved_filter_unsupported`. The catalogue access and the daily\
        \ limit of the catalogue apply: a count costs one unit of that limit the first\
        \ time a filter is counted in a UTC day, and counting the same filter again\
        \ that day is free."
      operationId: countSavedFilterMedias
      parameters:
      - description: The project.
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      - description: The saved filter.
        explode: false
        in: path
        name: filterId
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/countSavedFilterMedias_200_response"
          description: The number of matching medias.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "The API key is missing, malformed, unknown, revoked or expired,\
            \ or its account cannot sign in (code `unauthorized`)."
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "The catalogue is open to accounts with recent completed orders,\
            \ as buyer or as seller, and to other accounts within a daily trial quota;\
            \ this account has no such order and the trial quota is off (code `catalogue_requires_recent_order`).\
            \ GET /me reports `catalogue.eligible` and `catalogue.dailyCap`."
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "The resource does not exist, or it is not yours (code `not_found`)."
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: The saved filter uses a web filter the API does not support
            (code `saved_filter_unsupported`); `details.field` names it.
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Over the rate limit (code `rate_limit_exceeded`), or too many\
            \ failed authentications (code `too_many_failed_authentications`): with\
            \ this key from this address, or from this address with any key; a valid\
            \ key is never refused for it. On the catalogue operations, also when\
            \ the response would take the account beyond the units of the catalogue\
            \ it may spend per UTC day (code `catalogue_daily_cap_reached`): each\
            \ new media costs one unit and a response that holds no new media, an\
            \ empty one or a count included, costs one unless the same request was\
            \ answered today while the media lists, topics and language of its project\
            \ stayed as they were, which is free; `details.remaining` says how many\
            \ units still fit today, `details.limit` is the daily cap that applies\
            \ and `details.tier` is `full`, or `trial` for an account without a recent\
            \ completed order, whose quota rises to the full cap after one; `Retry-After`\
            \ is the time to the next UTC midnight, and a request already answered\
            \ today stays readable. On the managed service requests, also when you\
            \ sent as many requests of that kind as you may per UTC day (code `managed_service_request_limit_reached`):\
            \ `Retry-After` is the time to the next UTC midnight. On POST /seller/medias,\
            \ also when you sent as many medias that are already registered as you\
            \ may per UTC day (code `media_duplicate_limit_reached`): `Retry-After`\
            \ is the time to the next UTC midnight, and medias not registered yet\
            \ are still accepted."
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: An unexpected error (code `internal_error`).
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "The rate limiter cannot be reached, so the call is refused\
            \ (code `rate_limit_unavailable`), or a stored file cannot be read right\
            \ now (code `storage_unavailable`). Retry later."
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
      summary: Count the medias of a saved filter
      tags:
      - Saved filters
  /api/v1/projects/{id}/saved-filters:
    get:
      description: "Your saved filters of one of your projects, newest first, including\
        \ those saved on the web. A project has at most 100. Apply one with `savedFilterId`\
