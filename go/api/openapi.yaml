            \ or its account cannot sign in (code `unauthorized`)."
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: The key is read-only (code `insufficient_capability`).
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Nothing was registered: your seller account is restricted\
            \ (code `seller_restricted`); or the media is registered already (code\
            \ `media_already_registered`), with `details.mediaId` naming it only when\
            \ it is yours, and the refusal counts toward the daily limit of such refusals;\
            \ or the `Idempotency-Key` conflicts (codes `idempotency_key_reused`,\
            \ `idempotency_request_in_progress`, `idempotency_outcome_unknown`)."
