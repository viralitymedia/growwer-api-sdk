          description: "The rate limiter cannot be reached, so the call is refused\
            \ (code `rate_limit_unavailable`), or a stored file cannot be read right\
            \ now (code `storage_unavailable`). Retry later."
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
      summary: List the saved filters of a project
      tags:
      - Saved filters
    post:
      description: "Saves a catalogue search of one of your projects, which then also\
        \ appears on the web. `filters` takes the filter parameters of GET /projects/{id}/medias,\
        \ and `source`, with the same values; lists may be JSON arrays and flags JSON\
        \ booleans. With `notificationFrequency`, Growwer emails you new medias that\
        \ match. A project has at most 100 saved filters and an account 500."
      operationId: createSavedFilter
      parameters:
      - description: The project.
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      - description: "A new key for each write, reused only to retry that same write.\
          \ 1 to 255 printable ASCII characters without spaces (`!` to `~`); any other\
          \ value answers 400 `invalid_idempotency_key`."
        explode: false
        in: header
        name: Idempotency-Key
        required: true
        schema:
          maxLength: 255
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/createSavedFilter_request"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedFilter"
          description: The saved filter.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "The write has no `Idempotency-Key` header (code `idempotency_key_required`),\
            \ the header is not 1 to 255 printable ASCII characters without spaces\
            \ (code `invalid_idempotency_key`), or the body is not a JSON object (code\
            \ `invalid_json`)."
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "The API key is missing, malformed, unknown, revoked or expired,\
            \ or its account cannot sign in (code `unauthorized`)."
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "The key lacks the capability the operation needs (code `insufficient_capability`),\
            \ or the account may not perform it (code `forbidden`)."
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "The resource does not exist, or it is not yours (code `not_found`)."
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "The project already has 100 saved filters, or the account\
            \ 500 (code `saved_filter_limit_reached`), or the `Idempotency-Key` conflicts\
            \ (codes `idempotency_key_reused`, `idempotency_request_in_progress`,\
            \ `idempotency_outcome_unknown`)."
        "422":
          content:
            application/json:
              example:
                code: validation_failed
                message: The request is not valid. See details for each field.
                requestId: 9b2f6c1e-4d7a-4e3b-8a5f-2c1d0e9f7a64
                details:
                  fields:
                    promotedProducts:
                    - This collection should contain 5 elements or more.
              schema:
                $ref: "#/components/schemas/Error"
          description: "The request is not valid (code `validation_failed`). `details.fields`\
            \ holds the messages for each invalid field, by field name."
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Over the rate limit (code `rate_limit_exceeded`), or too many\
            \ failed authentications (code `too_many_failed_authentications`): with\
            \ this key from this address, or from this address with any key; a valid\
            \ key is never refused for it. On the catalogue operations, also when\
            \ the response would take the account beyond the units of the catalogue\
            \ it may spend per UTC day (code `catalogue_daily_cap_reached`): each\
            \ new media costs one unit and a response that holds no new media, an\
            \ empty one or a count included, costs one unless the same request was\
