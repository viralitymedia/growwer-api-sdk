      operationId: listSavedFilters
      parameters:
      - description: The project.
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listSavedFilters_200_response"
          description: The saved filters and how many there are.
        "401":
