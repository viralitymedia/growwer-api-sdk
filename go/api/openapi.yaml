      description: "Asks Growwer to find the medias of these domains for one of your\
        \ projects, as the \"request specific domains\" form on the web does. Each\
        \ entry may be a domain or a URL; it is read as its full domain, lowercased.\
        \ Repeated domains are requested once, and a domain already requested changes\
        \ nothing. Up to 200 distinct domains per call. They then appear in the project's\
        \ catalogue with `project.requested` true (`requested=true` on GET /projects/{id}/medias)\
        \ once Growwer lists them."
      operationId: requestMedias
      parameters:
      - description: The project.
        explode: false
        in: path
