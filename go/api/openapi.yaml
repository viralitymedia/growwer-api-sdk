      parameters:
      - description: "A new key for each write, reused only to retry that same write.\
          \ 1 to 255 printable ASCII characters without spaces (`!` to `~`); any other\
          \ value answers 400 `invalid_idempotency_key`."
        explode: false
        in: header
        name: Idempotency-Key
        required: true
        schema:
          maxLength: 255
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderCreateRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
          description: "The order, placed and paid. `Location` is its URL."
          headers:
            Location:
              description: The URL of the new order.
              explode: false
              schema:
                type: string
              style: simple
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "The write has no `Idempotency-Key` header (code `idempotency_key_required`),\
            \ the header is not 1 to 255 printable ASCII characters without spaces\
            \ (code `invalid_idempotency_key`), or the body is not a JSON object (code\
            \ `invalid_json`)."
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "The API key is missing, malformed, unknown, revoked or expired,\
            \ or its account cannot sign in (code `unauthorized`)."
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: The key is read-only (code `insufficient_capability`).
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "The project is not yours, or the media does not exist or is\
            \ not one you can order for this project (code `not_found`)."
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: |-
            The order cannot be placed, and nothing was charged:
            - `price_changed`: the price is not `expectedPrice`; `details.currentPrice` is the price.
            - `insufficient_balance`: your available balance does not cover the price; `details` has `required`, `available` and `missing` (Money).
            - `duplicate_order`: the same order was placed seconds ago; `details.orderId` is that order, or null.
            - `seller_on_holiday`: the media is not taking orders right now.
            - `media_topic_not_allowed`: the media does not accept the project's topic.
            - `offer_unavailable`: the media does not offer this type of order.
            - `idempotency_key_reused`, `idempotency_request_in_progress`, `idempotency_outcome_unknown`: the `Idempotency-Key` conflicts.
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "The body is not valid (code `validation_failed`, with the\
            \ messages of each field in `details.fields`), or `proposedDraftFileId`\
            \ names no file you can use: it does not exist, has expired or was already\
            \ used (code `file_unusable`)."
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Over the rate limit (code `rate_limit_exceeded`), or too many\
            \ failed authentications (code `too_many_failed_authentications`): with\
            \ this key from this address, or from this address with any key; a valid\
            \ key is never refused for it. On the catalogue operations, also when\
            \ the response would take the account beyond the units of the catalogue\
            \ it may spend per UTC day (code `catalogue_daily_cap_reached`): each\
            \ new media costs one unit and a response that holds no new media, an\
            \ empty one or a count included, costs one unless the same request was\
            \ answered today while the media lists, topics and language of its project\
            \ stayed as they were, which is free; `details.remaining` says how many\
            \ units still fit today, `details.limit` is the daily cap that applies\
            \ and `details.tier` is `full`, or `trial` for an account without a recent\
            \ completed order, whose quota rises to the full cap after one; `Retry-After`\
            \ is the time to the next UTC midnight, and a request already answered\
            \ today stays readable. On the managed service requests, also when you\
            \ sent as many requests of that kind as you may per UTC day (code `managed_service_request_limit_reached`):\
            \ `Retry-After` is the time to the next UTC midnight. On POST /seller/medias,\
            \ also when you sent as many medias that are already registered as you\
            \ may per UTC day (code `media_duplicate_limit_reached`): `Retry-After`\
            \ is the time to the next UTC midnight, and medias not registered yet\
            \ are still accepted."
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: An unexpected error (code `internal_error`).
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "The rate limiter cannot be reached, so the call is refused\
