      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      - description: "A new key for each write, reused only to retry that same write.\
          \ 1 to 255 printable ASCII characters without spaces (`!` to `~`); any other\
          \ value answers 400 `invalid_idempotency_key`."
        explode: false
        in: header
        name: Idempotency-Key
        required: true
        schema:
          maxLength: 255
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            example:
              typology: blog
              postOffer:
                maximumLinks: 2
                advertisingLabellingPolicy: always
                promotedSocialNetworks:
                - twitter
                - newsletter
                pricingOptions:
                - linkType: dofollow
                  feeWhenSellerWritesPost:
                    amount: 12000
                    currency: EUR
                  feeWhenSellerDoesNotWritePost:
                    amount: 10000
                    currency: EUR
                - linkType: nofollow
                  feeWhenSellerWritesPost:
                    amount: 9000
                    currency: EUR
                  feeWhenSellerDoesNotWritePost:
                    amount: 7000
                    currency: EUR
              linkAdditionOffer: null
              extraServices:
              - name: list_on_homepage
                cost:
                  amount: 5000
                  currency: EUR
            schema:
              $ref: "#/components/schemas/updateSellerMedia_request"
        required: true
