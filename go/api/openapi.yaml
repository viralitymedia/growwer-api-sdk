openapi: 3.0.0
info:
  contact:
    email: support@growwer.com
    name: Growwer Support
    url: https://growwer.com/contact/
  description: |
    The Growwer customer API. Authenticate every call with an API key created on
    your profile page, sent as `Authorization: Bearer <key>`. A read key can call
    every GET operation; writes need a read and write key and an
    `Idempotency-Key` header.

    Idempotency: use a new `Idempotency-Key` (1 to 255 printable ASCII
    characters without spaces) for each operation and reuse it only to retry that same
    operation. Keys belong to your account, not to one API key.
    - A successful write is stored for 30 days: a retry with the same key and
      the same request replays its response with `Idempotent-Replayed: true`
      and does nothing again.
    - A refused write (4xx) has no effect and releases its key: once you fix the
      cause, retry with the same key and the write runs.
    - A failed write (5xx) may have taken effect, so it is never run again under
      its key: a retry gets 409 `idempotency_outcome_unknown`. Check whether it
      took effect before retrying with a new key.
    - A retry while the first request is still running gets 409
      `idempotency_request_in_progress`. A request still running after 5 minutes
      is treated as failed: a retry gets 409 `idempotency_outcome_unknown`.
    - The same key with a different request (method, path, query or body) gets
      409 `idempotency_key_reused`. A write without the header gets 400
      `idempotency_key_required`.

    Every response carries `X-Request-Id`. Errors share one shape,
    `{code, message, requestId, details?}`. Money is integer cents plus a
    currency code and dates are ISO-8601.
  license:
    name: Proprietary
    url: https://growwer.com/legal/terms-of-use/
  termsOfService: https://growwer.com/legal/terms-of-use/
  title: Growwer API
  version: "1"
servers:
- description: Production
  url: https://tool.growwer.com
security:
- apiKey: []
tags:
- description: "Your profile, balances and catalogue quota, and the codes and names\
    \ the API uses."
  name: Account
- description: "Upload the documents that a later write, such as an order's briefing,\
    \ references."
  name: Files
- description: "Create, edit and delete the projects you buy for."
  name: Projects
- description: "Search the medias of a project, its flash offers, favourites and discards."
  name: Catalogue
- description: Save catalogue searches of a project and count their medias.
  name: Saved filters
- description: "Estimate, place and follow the orders you buy, and act on them."
  name: Buyer orders
- description: "Your buyer balance, its movements and documents, and your invoices."
  name: Buyer wallet
- description: "Your managed service campaigns, their proposals, and requests to Growwer."
  name: Managed services
- description: "Your seller holiday, during which your medias take no orders."
  name: Seller account
- description: The medias you sell on and their fees.
  name: Seller medias
- description: "The orders placed on your medias, and accepting, delivering or refusing\
    \ them."
  name: Seller orders
- description: "Your seller balance, its movements and documents, and your withdrawals."
  name: Seller wallet
paths:
  /api/v1/me:
    get:
      description: "Profile basics, the buyer and seller balances, whether your seller\
        \ account is restricted, whether the catalogue is open to you, and whether\
        \ you have a managed service."
      operationId: getMe
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getMe_200_response"
          description: Your account.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "The API key is missing, malformed, unknown, revoked or expired,\
            \ or its account cannot sign in (code `unauthorized`)."
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "Over the rate limit (code `rate_limit_exceeded`), or too many\
            \ failed authentications (code `too_many_failed_authentications`): with\
            \ this key from this address, or from this address with any key; a valid\
            \ key is never refused for it. On the catalogue operations, also when\
            \ the response would take the account beyond the units of the catalogue\
            \ it may spend per UTC day (code `catalogue_daily_cap_reached`): each\
            \ new media costs one unit and a response that holds no new media, an\
            \ empty one or a count included, costs one unless the same request was\
            \ answered today while the media lists, topics and language of its project\
            \ stayed as they were, which is free; `details.remaining` says how many\
            \ units still fit today, `details.limit` is the daily cap that applies\
            \ and `details.tier` is `full`, or `trial` for an account without a recent\
            \ completed order, whose quota rises to the full cap after one; `Retry-After`\
            \ is the time to the next UTC midnight, and a request already answered\
            \ today stays readable. On the managed service requests, also when you\
            \ sent as many requests of that kind as you may per UTC day (code `managed_service_request_limit_reached`):\
            \ `Retry-After` is the time to the next UTC midnight. On POST /seller/medias,\
            \ also when you sent as many medias that are already registered as you\
            \ may per UTC day (code `media_duplicate_limit_reached`): `Retry-After`\
            \ is the time to the next UTC midnight, and medias not registered yet\
            \ are still accepted."
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: An unexpected error (code `internal_error`).
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "The rate limiter cannot be reached, so the call is refused\
            \ (code `rate_limit_unavailable`), or a stored file cannot be read right\
            \ now (code `storage_unavailable`). Retry later."
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
      summary: Your account
      tags:
      - Account
