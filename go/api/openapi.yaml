            \ is the time to the next UTC midnight, and medias not registered yet\
            \ are still accepted."
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: An unexpected error (code `internal_error`).
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "The rate limiter cannot be reached, so the call is refused\
            \ (code `rate_limit_unavailable`), or a stored file cannot be read right\
            \ now (code `storage_unavailable`). Retry later."
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
      summary: List your buyer wallet movements
      tags:
      - Buyer wallet
components:
  headers:
    RetryAfter:
      description: Seconds to wait before retrying.
      explode: false
      schema:
        type: integer
      style: simple
    RateLimitLimit:
      description: Requests allowed in the current window.
      explode: false
      schema:
        type: integer
      style: simple
    RateLimitRemaining:
      description: Requests left in the current window.
      explode: false
      schema:
        type: integer
      style: simple
    RateLimitReset:
      description: Seconds until the current window resets.
      explode: false
      schema:
        type: integer
      style: simple
  parameters:
    IdempotencyKey:
      description: "A new key for each write, reused only to retry that same write.\
        \ 1 to 255 printable ASCII characters without spaces (`!` to `~`); any other\
        \ value answers 400 `invalid_idempotency_key`."
      explode: false
      in: header
      name: Idempotency-Key
      required: true
      schema:
        maxLength: 255
        type: string
      style: simple
    CatalogueSource:
      description: "Which of the project's medias to search: `all` (the default),\
        \ `recommended` (those Growwer recommends for the project), or those you marked\
        \ `favourite`, `discarded` or `requested`, or `bought` for the project. Do\
        \ not combine it with the parameter of the same state."
      explode: true
      in: query
      name: source
      required: false
      schema:
        enum:
        - all
        - recommended
        - favourite
        - discarded
        - requested
        - bought
        type: string
      style: form
    CatalogueSort:
      description: "The order. Without it, the web's default order: medias on the\
        \ project's topic and language first, then best sellers and medias with more\
        \ published orders. Ties are always broken by media id, so pages never overlap.\
        \ `-growwerRank`: best match first; `postPrice`, `linkAdditionPrice`: cheapest\
        \ first; `matchedAt`, `-matchedAt`: when Growwer matched the media with the\
        \ project; `-traffic`, `-domainRating`, `-referringDomains`: highest first;\
        \ `linkedToReferringRatio`: lowest first."
      explode: true
      in: query
      name: sort
      required: false
      schema:
        enum:
        - -growwerRank
        - postPrice
        - linkAdditionPrice
        - matchedAt
        - -matchedAt
        - -traffic
        - -domainRating
        - linkedToReferringRatio
        - -referringDomains
        type: string
      style: form
    CatalogueDomain:
      description: "Medias whose domain contains this text, 1 to 255 characters."
      explode: true
      in: query
      name: domain
      required: false
      schema:
        type: string
      style: form
    CatalogueWebsiteType:
      description: "A comma-separated list of website types: `blog`, `press`."
      explode: true
      in: query
      name: websiteType
      required: false
      schema:
        type: string
      style: form
    CatalogueLanguage:
      description: "A comma-separated list of language codes, as in GET /vocabulary."
      explode: true
      in: query
      name: language
      required: false
      schema:
        type: string
      style: form
    CatalogueCountry:
      description: "A comma-separated list of country codes, as in GET /vocabulary."
      explode: true
      in: query
      name: country
      required: false
      schema:
        type: string
      style: form
    CatalogueTopics:
      description: "A comma-separated list of topic ids, as in GET /vocabulary: medias\
        \ on any of them."
      explode: true
      in: query
      name: topics
      required: false
      schema:
        type: string
      style: form
    CatalogueNotBannedTopics:
      description: Leave out medias that refuse the topic of the project. Only `true`
        applies it; omit it otherwise.
      explode: true
      in: query
      name: notBannedTopics
      required: false
      schema:
        type: boolean
      style: form
    CatalogueMinTraffic:
      description: Minimum monthly organic traffic.
      explode: true
      in: query
      name: minTraffic
      required: false
      schema:
        type: integer
      style: form
    CatalogueMaxTraffic:
      description: Maximum monthly organic traffic.
      explode: true
      in: query
      name: maxTraffic
      required: false
      schema:
        type: integer
      style: form
    CatalogueTrafficTrendUpward:
      description: Medias whose traffic is growing. Only `true` applies it; omit it
        otherwise.
      explode: true
      in: query
      name: trafficTrendUpward
      required: false
      schema:
        type: boolean
      style: form
    CatalogueMinDomainRating:
      description: "Minimum domain rating, 0 to 100."
      explode: true
      in: query
      name: minDomainRating
      required: false
      schema:
        type: integer
      style: form
    CatalogueMaxDomainRating:
      description: "Maximum domain rating, 0 to 100."
      explode: true
      in: query
      name: maxDomainRating
      required: false
      schema:
        type: integer
      style: form
    CatalogueMinLinkedToReferringRatio:
      description: "Minimum ratio of linked domains to referring domains, such as\
        \ 0.5."
      explode: true
      in: query
      name: minLinkedToReferringRatio
      required: false
      schema:
        type: number
      style: form
    CatalogueMaxLinkedToReferringRatio:
      description: "Maximum ratio of linked domains to referring domains, such as\
        \ 1.5."
      explode: true
      in: query
      name: maxLinkedToReferringRatio
      required: false
      schema:
        type: number
      style: form
    CatalogueMinPostPrice:
      description: "Minimum post price, in cents."
      explode: true
      in: query
      name: minPostPrice
      required: false
      schema:
        type: integer
      style: form
    CatalogueMaxPostPrice:
      description: "Maximum post price, in cents."
      explode: true
      in: query
      name: maxPostPrice
      required: false
      schema:
        type: integer
      style: form
    CataloguePostLinkType:
      description: "A comma-separated list of link types the post offer gives: `dofollow`,\
        \ `nofollow`, `citation`."
      explode: true
      in: query
      name: postLinkType
      required: false
      schema:
        type: string
      style: form
    CataloguePromotedSocialNetwork:
      description: "A comma-separated list of social networks the media promotes posts\
        \ on: `twitter`, `instagram`, `facebook`, `pinterest`, `tumblr`, `newsletter`."
      explode: true
      in: query
      name: promotedSocialNetwork
      required: false
      schema:
        type: string
      style: form
    CatalogueWithoutAdvertisingLabel:
      description: Medias that never label posts as advertising. Only `true` applies
        it; omit it otherwise.
      explode: true
      in: query
      name: withoutAdvertisingLabel
      required: false
      schema:
        type: boolean
      style: form
    CatalogueHomepageListing:
      description: Medias that offer listing the post on their homepage. Only `true`
        applies it; omit it otherwise.
      explode: true
      in: query
      name: homepageListing
      required: false
      schema:
        type: boolean
      style: form
    CatalogueHasLinkAddition:
      description: Medias that offer adding a link to an existing article. Only `true`
        applies it; omit it otherwise.
      explode: true
      in: query
      name: hasLinkAddition
      required: false
      schema:
        type: boolean
      style: form
    CatalogueMinLinkAdditionPrice:
      description: "Minimum link addition price, in cents."
      explode: true
      in: query
      name: minLinkAdditionPrice
      required: false
      schema:
        type: integer
      style: form
    CatalogueMaxLinkAdditionPrice:
      description: "Maximum link addition price, in cents."
      explode: true
      in: query
      name: maxLinkAdditionPrice
      required: false
      schema:
        type: integer
      style: form
    CatalogueLinkAdditionLinkType:
      description: "A comma-separated list of link types the link addition offer gives:\
        \ `dofollow`, `nofollow`, `citation`."
      explode: true
      in: query
      name: linkAdditionLinkType
      required: false
      schema:
        type: string
      style: form
    CatalogueRecommended:
      description: "`true`: only the medias Growwer recommends for the project; `false`:\
        \ only the others."
      explode: true
      in: query
      name: recommended
      required: false
      schema:
        type: boolean
      style: form
    CatalogueFavourite:
      description: "`true`: only your favourites for the project; `false`: leave them\
        \ out."
      explode: true
      in: query
      name: favourite
      required: false
      schema:
        type: boolean
      style: form
    CatalogueRequested:
      description: "`true`: only the medias you requested for the project; `false`:\
        \ leave them out."
      explode: true
      in: query
      name: requested
      required: false
      schema:
        type: boolean
      style: form
    CatalogueFlashOffer:
      description: "`true`: only medias with a flash offer running; `false`: leave\
        \ them out."
      explode: true
      in: query
      name: flashOffer
      required: false
      schema:
        type: boolean
      style: form
    CatalogueBought:
      description: "`true`: only medias you bought for the project; `false`: leave\
        \ them out."
      explode: true
      in: query
      name: bought
      required: false
      schema:
        type: boolean
      style: form
    CatalogueDiscarded:
      description: "`true`: only the medias you discarded for the project; `false`:\
        \ leave them out."
      explode: true
      in: query
      name: discarded
      required: false
      schema:
        type: boolean
      style: form
    CatalogueNew:
      description: Medias Growwer matched with the project recently. Only `true` applies
        it; omit it otherwise.
      explode: true
      in: query
      name: new
      required: false
      schema:
        type: boolean
      style: form
    CatalogueRanksGoalKeyword:
      description: "A comma-separated list of keyword origins: medias that rank for\
        \ a keyword of the project from any of them. `user`: your keywords; `publicGenerated`:\
        \ keywords Growwer found for the project."
      explode: true
      in: query
      name: ranksGoalKeyword
      required: false
      schema:
        type: string
      style: form
    CatalogueRanksAiKeyword:
      description: "A comma-separated list of AI answer engines: medias the web lists\
        \ an AI keyword of the project for, from any of them. `googleAiOverview`,\
        \ `chatgpt`, `googleAiMode`."
      explode: true
      in: query
      name: ranksAiKeyword
      required: false
      schema:
        type: string
      style: form
  responses:
    Unauthorized:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      description: "The API key is missing, malformed, unknown, revoked or expired,\
        \ or its account cannot sign in (code `unauthorized`)."
    Forbidden:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      description: "The key lacks the capability the operation needs (code `insufficient_capability`),\
        \ or the account may not perform it (code `forbidden`)."
    CatalogueForbidden:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      description: "The catalogue is open to accounts with recent completed orders,\
        \ as buyer or as seller, and to other accounts within a daily trial quota;\
        \ this account has no such order and the trial quota is off (code `catalogue_requires_recent_order`).\
        \ GET /me reports `catalogue.eligible` and `catalogue.dailyCap`."
    TooManyRequests:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      description: "Over the rate limit (code `rate_limit_exceeded`), or too many\
        \ failed authentications (code `too_many_failed_authentications`): with this\
        \ key from this address, or from this address with any key; a valid key is\
        \ never refused for it. On the catalogue operations, also when the response\
        \ would take the account beyond the units of the catalogue it may spend per\
        \ UTC day (code `catalogue_daily_cap_reached`): each new media costs one unit\
        \ and a response that holds no new media, an empty one or a count included,\
        \ costs one unless the same request was answered today while the media lists,\
        \ topics and language of its project stayed as they were, which is free; `details.remaining`\
        \ says how many units still fit today, `details.limit` is the daily cap that\
        \ applies and `details.tier` is `full`, or `trial` for an account without\
        \ a recent completed order, whose quota rises to the full cap after one; `Retry-After`\
        \ is the time to the next UTC midnight, and a request already answered today\
        \ stays readable. On the managed service requests, also when you sent as many\
        \ requests of that kind as you may per UTC day (code `managed_service_request_limit_reached`):\
        \ `Retry-After` is the time to the next UTC midnight. On POST /seller/medias,\
        \ also when you sent as many medias that are already registered as you may\
        \ per UTC day (code `media_duplicate_limit_reached`): `Retry-After` is the\
        \ time to the next UTC midnight, and medias not registered yet are still accepted."
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
    ServiceUnavailable:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      description: "The rate limiter cannot be reached, so the call is refused (code\
        \ `rate_limit_unavailable`), or a stored file cannot be read right now (code\
        \ `storage_unavailable`). Retry later."
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
    InternalError:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      description: An unexpected error (code `internal_error`).
    BadRequest:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      description: "The write has no `Idempotency-Key` header (code `idempotency_key_required`),\
        \ the header is not 1 to 255 printable ASCII characters without spaces (code\
        \ `invalid_idempotency_key`), or the body is not a JSON object (code `invalid_json`)."
    NotFound:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      description: "The resource does not exist, or it is not yours (code `not_found`)."
    IdempotencyConflict:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      description: "The `Idempotency-Key` was used for a different request (code `idempotency_key_reused`),\
        \ its first request is still running (code `idempotency_request_in_progress`),\
        \ or its first request failed and may have taken effect (code `idempotency_outcome_unknown`)."
    ValidationFailed:
      content:
        application/json:
          example:
            code: validation_failed
            message: The request is not valid. See details for each field.
            requestId: 9b2f6c1e-4d7a-4e3b-8a5f-2c1d0e9f7a64
            details:
              fields:
                promotedProducts:
                - This collection should contain 5 elements or more.
          schema:
            $ref: "#/components/schemas/Error"
      description: "The request is not valid (code `validation_failed`). `details.fields`\
        \ holds the messages for each invalid field, by field name."
  schemas:
    Error:
      example:
        code: unauthorized
        message: message
        requestId: 9b2f6c1e-4d7a-4e3b-8a5f-2c1d0e9f7a64
        details:
          key: ""
      properties:
        code:
          description: "A stable, machine-readable error code."
          example: unauthorized
          type: string
        message:
          description: A human-readable explanation. It may change.
          type: string
        requestId:
          description: "UUID v4 generated per request, or the `X-Request-Id` you sent.\
            \ Quote it when reporting a problem."
          example: 9b2f6c1e-4d7a-4e3b-8a5f-2c1d0e9f7a64
          type: string
        details:
          additionalProperties: true
          description: "Extra data on some errors, such as the invalid fields of a\
            \ validation_failed error."
          type: object
      required:
      - code
      - message
      - requestId
      type: object
    Money:
      example:
        amount: 12500
        currency: EUR
      properties:
        amount:
          description: Integer cents.
          example: 12500
          type: integer
        currency:
          description: ISO 4217 currency code.
          example: EUR
          type: string
      required:
      - amount
      - currency
      type: object
    CodeName:
      example:
        code: code
        name: name
      properties:
        code:
          type: string
        name:
          type: string
      required:
      - code
      - name
      type: object
    Balance:
      example:
        available: ""
        pending: ""
      properties:
        available:
          allOf:
          - $ref: "#/components/schemas/Money"
          description: "What can be spent, or withdrawn, now."
        pending:
          allOf:
          - $ref: "#/components/schemas/Money"
          description: What is held until orders in progress settle.
      required:
      - available
      - pending
      type: object
    Project:
      example:
        id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        name: name
        rootUrl: https://openapi-generator.tech
        websiteType: ecommerce
        topics:
        - 0
        - 0
        language: es
        country: ES
        promotedProducts:
        - promotedProducts
        - promotedProducts
        userKeywords:
        - userKeywords
        - userKeywords
        state: analyzing
        createdAt: 2000-01-23T04:56:07.000+00:00
      properties:
        id:
          format: uuid
          type: string
        name:
          description: "Your name for the project, or null when it has none."
          nullable: true
          type: string
        rootUrl:
          description: The website the project promotes. It cannot be changed once
            the project exists.
          format: uri
          type: string
        websiteType:
          description: "What the website is: an online shop (`ecommerce`), a services\
            \ business (`services`) or anything else (`other`)."
          enum:
          - ecommerce
          - services
          - other
          type: string
        topics:
          description: "The website's topic, as a topic id from GET /vocabulary. Exactly\
            \ one."
          items:
            type: integer
          type: array
        language:
          description: "The language of the campaign, as a language code from GET\
            \ /vocabulary."
          example: es
          type: string
        country:
          description: "The country the campaign targets, as a country code from GET\
            \ /vocabulary, or null for worldwide."
          example: ES
          nullable: true
          type: string
        promotedProducts:
          description: "The products or services the campaign promotes, 5 to 10."
          items:
            type: string
          type: array
        userKeywords:
          description: "Keywords you want the campaign to target, at most 100."
          items:
            type: string
          type: array
        state:
          description: |
            `finished` once Growwer has recommended media for the project, `analyzing`
            until then. Analysis can take hours, and it never finishes when no medium
            matches the project. Poll with backoff, and use `createdAt` to decide how
            long to keep polling.
          enum:
          - analyzing
          - finished
          type: string
        createdAt:
          format: date-time
          type: string
      required:
      - country
      - createdAt
      - id
      - language
      - name
      - promotedProducts
      - rootUrl
      - state
      - topics
      - userKeywords
      - websiteType
      type: object
    MoneyOrNull:
      nullable: true
      properties:
        amount:
          description: Integer cents.
          example: 12500
          type: integer
        currency:
          description: ISO 4217 currency code.
          example: EUR
          type: string
      required:
      - amount
      - currency
      type: object
    CatalogueOffer:
      properties:
        price:
          allOf:
          - $ref: "#/components/schemas/Money"
          description: "What you pay for the offer with its dearest link type, flash\
            \ offer discount included."
        linkType:
          description: The link type `price` is for.
          enum:
          - dofollow
          - nofollow
          - citation
          - null
          nullable: true
          type: string
        prices:
          additionalProperties:
            $ref: "#/components/schemas/Money"
          description: "What you pay for each link type the offer gives, by link type."
          type: object
        previousPrice:
          allOf:
          - $ref: "#/components/schemas/MoneyOrNull"
          description: "The highest price the offer has had, when `price` is more\
            \ than 5% below it; otherwise null."
      required:
      - linkType
      - previousPrice
      - price
      - prices
      type: object
    CatalogueOfferOrNull:
      nullable: true
      properties:
        price:
          allOf:
          - $ref: "#/components/schemas/Money"
          description: "What you pay for the offer with its dearest link type, flash\
            \ offer discount included."
        linkType:
          description: The link type `price` is for.
          enum:
          - dofollow
          - nofollow
          - citation
          - null
          nullable: true
          type: string
        prices:
          additionalProperties:
            $ref: "#/components/schemas/Money"
          description: "What you pay for each link type the offer gives, by link type."
          type: object
        previousPrice:
          allOf:
          - $ref: "#/components/schemas/MoneyOrNull"
          description: "The highest price the offer has had, when `price` is more\
            \ than 5% below it; otherwise null."
      required:
      - linkType
      - previousPrice
      - price
      - prices
      type: object
    CataloguePostOffer:
      allOf:
      - $ref: "#/components/schemas/CatalogueOffer"
      - properties:
          advertisingLabel:
            description: Whether the media always labels posts as advertising.
            type: boolean
          promotedSocialNetworks:
            description: Where the media promotes the post.
            items:
              enum:
              - twitter
              - instagram
              - facebook
              - pinterest
              - tumblr
              - newsletter
              type: string
            type: array
          extras:
            $ref: "#/components/schemas/CataloguePostOffer_allOf_extras"
        required:
        - advertisingLabel
        - extras
        - promotedSocialNetworks
        type: object
      example:
        price: ""
        linkType: dofollow
        prices:
          key:
            amount: 12500
            currency: EUR
        previousPrice: ""
        advertisingLabel: true
        promotedSocialNetworks:
        - twitter
        - twitter
        extras:
          homepageListing: ""
          sensitiveTopic:
            allowed: true
            extraPrice: ""
    CatalogueMedia:
      example:
        id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        domain: example.com
        type: blog
        language: language
        country: country
        topics:
        - 0
        - 0
        metrics:
          organicTraffic: 6.027456183070403
          domainRating: 1.4658129805029452
          referringDomains: 5.962133916683182
          linkedDomains: 5.637376656633329
          linkedToReferringRatio: 2.3021358869347655
        positiveTrafficTrend: true
        bestSeller: true
        publicationRate: 7
        averageDaysToPublication: 9
        onHoliday: true
        flashOffer:
          discountPercent: 3
          endsAt: 2000-01-23T04:56:07.000+00:00
        postOffer:
          price: ""
          linkType: dofollow
          prices:
            key:
              amount: 12500
              currency: EUR
          previousPrice: ""
          advertisingLabel: true
          promotedSocialNetworks:
          - twitter
          - twitter
          extras:
            homepageListing: ""
            sensitiveTopic:
              allowed: true
              extraPrice: ""
        linkAdditionOffer: ""
      properties:
        id:
          format: uuid
          type: string
        domain:
          example: example.com
          type: string
        type:
          enum:
          - blog
          - press
          type: string
        language:
          description: "A language code, as in GET /vocabulary."
          type: string
        country:
          description: "A country code, as in GET /vocabulary, or null for none."
          nullable: true
          type: string
        topics:
          description: "Topic ids, as in GET /vocabulary."
          items:
            type: integer
          type: array
        metrics:
          $ref: "#/components/schemas/CatalogueMedia_metrics"
        positiveTrafficTrend:
          type: boolean
        bestSeller:
          type: boolean
        publicationRate:
          description: "The share of the media's orders that were published, in percent,\
            \ or null without orders."
          nullable: true
          type: integer
        averageDaysToPublication:
          description: "The average days from order to publication, or null without\
            \ published orders."
          nullable: true
