  /api/v1/files:
    post:
      description: |-
        Uploads a document (odt, doc, docx or txt, up to 8 MB) for a later write to reference by its `id`. A file belongs to you, can be used by one write, and expires 24 hours after it was uploaded; an expired or used file is answered like an unknown one.

        You may hold 20 files that no write has used yet and that have not expired. Past them it answers 429 `file_limit_reached`, with `details.limit` the number you may hold and `Retry-After` the seconds until the first of them expires; using one of them in a write frees its place at once. A file refused as invalid (422) is refused before they are counted, and a refused upload stores nothing.
      operationId: uploadFile
      parameters:
      - description: "A new key for each write, reused only to retry that same write.\
          \ 1 to 255 printable ASCII characters without spaces (`!` to `~`); any other\
          \ value answers 400 `invalid_idempotency_key`."
        explode: false
        in: header
        name: Idempotency-Key
        required: true
        schema:
          maxLength: 255
          type: string
        style: simple
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/uploadFile_request"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/uploadFile_201_response"
          description: "The file, stored until `expiresAt`."
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "The write has no `Idempotency-Key` header (code `idempotency_key_required`),\
            \ the header is not 1 to 255 printable ASCII characters without spaces\
            \ (code `invalid_idempotency_key`), or the body is not a JSON object (code\
            \ `invalid_json`)."
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "The API key is missing, malformed, unknown, revoked or expired,\
            \ or its account cannot sign in (code `unauthorized`)."
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: "The key lacks the capability the operation needs (code `insufficient_capability`),\
            \ or the account may not perform it (code `forbidden`)."
        "409":
